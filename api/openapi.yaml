openapi: 3.1.0
info:
  title: Independent Survey Platform API
  version: 0.2.5-development
  description: The development runtime supports anonymous survey creation, publication, submission, analytics and CSV exports. Synthetic Registry eligibility is available in disposable tests. The remaining design endpoints describe planned features.
servers:
- url: https://survey.example.org/api/v1
  description: Example only
security:
- bearerAuth: []
tags:
- name: Health
- name: Workspace
- name: Survey
- name: Respondent
- name: Reporting
- name: Notices
- name: Administration
- name: Live Quiz Arena
  description: Proposed real-time quiz hosting/join/scoring control APIs. Not implemented.
paths:
  /health/live:
    get:
      tags:
      - Health
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Service process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - Health
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Required dependencies available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/Unavailable'
  /me:
    get:
      tags:
      - Workspace
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorised'
  /workspaces:
    get:
      tags:
      - Workspace
      operationId: listMyWorkspaces
      responses:
        '200':
          description: Authorised workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorised'
  /surveys:
    get:
      tags:
      - Survey
      operationId: listSurveys
      parameters:
      - name: workspaceId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Workspace-scoped surveys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Survey
      operationId: createSurvey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /surveys/{surveyId}:
    parameters:
    - $ref: '#/components/parameters/SurveyId'
    get:
      tags:
      - Survey
      operationId: getSurvey
      responses:
        '200':
          description: Survey detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
        '404':
          $ref: '#/components/responses/NotFound'
  /surveys/{surveyId}/draft:
    parameters:
    - $ref: '#/components/parameters/SurveyId'
    put:
      tags:
      - Survey
      operationId: replaceDraftDefinition
      description: Replace editable draft after optimistic concurrency check. No editing of published versions.
      parameters:
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: Current draft ETag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyDefinition'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyDefinition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /surveys/{surveyId}/publish:
    parameters:
    - $ref: '#/components/parameters/SurveyId'
    post:
      tags:
      - Survey
      operationId: publishSurvey
      description: Validate and snapshot an immutable survey version. An optional distribution policy enables the synthetic Registry gate in tests.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                eligibilityMode:
                  type: string
                  enum: [open, registry-synthetic]
                  default: open
      responses:
        '201':
          description: New published version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          description: Publication options require application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /surveys/{surveyId}/versions:
    parameters:
    - $ref: '#/components/parameters/SurveyId'
    get:
      tags:
      - Survey
      operationId: listSurveyVersions
      responses:
        '200':
          description: Immutable versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishedVersion'
  /surveys/{surveyId}/close:
    parameters:
    - $ref: '#/components/parameters/SurveyId'
    post:
      tags:
      - Survey
      operationId: closeSurvey
      responses:
        '200':
          description: Survey closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Survey'
        '403':
          $ref: '#/components/responses/Forbidden'
  /public/s/{publicToken}:
    parameters:
    - $ref: '#/components/parameters/PublicToken'
    get:
      tags:
      - Respondent
      operationId: getPublishedPublicSurvey
      security: []
      description: Returns a public-safe published definition for open distributions and a verification prompt for synthetic Registry distributions without a valid capability.
      parameters:
      - $ref: '#/components/parameters/SurveyCapability'
      responses:
        '200':
          description: Published questionnaire or synthetic Registry prompt
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PublicSurvey'
                - type: object
                  additionalProperties: false
                  required: [eligibilityRequired]
                  properties:
                    eligibilityRequired:
                      const: true
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /public/s/{publicToken}/eligibility:
    parameters:
    - $ref: '#/components/parameters/PublicToken'
    post:
      tags:
      - Respondent
      operationId: verifySyntheticRegistryEligibility
      security: []
      description: Available for synthetic test distributions. Issues a temporary capability scoped to this distribution after successful verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proof]
              properties:
                proof:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{16,128}$'
      responses:
        '200':
          description: Temporary access, with no identity or provider receipt
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [capability, expiresAt]
                properties:
                  capability:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /public/s/{publicToken}/responses:
    parameters:
    - $ref: '#/components/parameters/PublicToken'
    post:
      tags:
      - Respondent
      operationId: submitResponse
      security: []
      parameters:
      - $ref: '#/components/parameters/SurveyCapability'
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitResponseRequest'
      responses:
        '201':
          description: New response accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseReceipt'
        '200':
          description: Identical retry already accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /surveys/{surveyId}/analytics:
    parameters:
    - $ref: '#/components/parameters/SurveyId'
    get:
      tags:
      - Reporting
      operationId: getSurveyAnalytics
      description: Aggregated metrics only, subject to permission and small-cell suppression.
      responses:
        '200':
          description: Authorised aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyAnalytics'
        '403':
          $ref: '#/components/responses/Forbidden'
  /surveys/{surveyId}/exports:
    parameters:
    - $ref: '#/components/parameters/SurveyId'
    post:
      tags:
      - Reporting
      operationId: requestSurveyExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: Export queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '403':
          $ref: '#/components/responses/Forbidden'
  /exports/{exportId}:
    parameters:
    - name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Reporting
      operationId: getExportJob
      description: Only requester or explicitly authorised recipient; completed URLs must be short-lived.
      responses:
        '200':
          description: Export job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /exports/{exportId}/download:
    parameters:
    - name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags: [Reporting]
      operationId: downloadExport
      description: Download an unexpired archive belonging to the authenticated requester.
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /me/notices:
    get:
      tags:
      - Notices
      operationId: listMyNotices
      responses:
        '200':
          description: Notices visible to caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notice'
  /me/notices/{noticeId}/acknowledge:
    parameters:
    - name: noticeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Notices
      operationId: acknowledgeNotice
      responses:
        '200':
          description: Acknowledged notice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notice'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/health:
    get:
      tags:
      - Administration
      operationId: getAdminHealth
      description: Requires ops:read. No private respondent contents.
      responses:
        '200':
          description: Privileged operational health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminHealth'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/notices:
    get:
      tags:
      - Administration
      operationId: listAdminNotices
      responses:
        '200':
          description: Authorised operational notices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notice'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/retention:
    get:
      tags:
      - Administration
      operationId: getRetentionPolicyStatus
      responses:
        '200':
          description: Retention policy status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/disposals:
    get:
      tags:
      - Administration
      operationId: listDisposalJobs
      responses:
        '200':
          description: Disposal processing state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisposalStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
  /live-sessions:
    post:
      tags:
      - Live Quiz Arena
      operationId: createLiveQuizSession
      summary: Create a live session from a published quiz version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quizVersionId
              - mode
              properties:
                quizVersionId:
                  type: string
                mode:
                  type: string
              additionalProperties: true
      responses:
        '201':
          description: Persisted live room with host-controlled settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': &id001
          description: Request refused by policy, permission or state.
        '403': *id001
  /live-sessions/join:
    post:
      tags:
      - Live Quiz Arena
      operationId: joinLiveQuizSession
      summary: Exchange an expiring join PIN for a session-scoped participant capability
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pin
              properties:
                pin:
                  type: string
              additionalProperties: true
      responses:
        '200':
          description: Scoped participant session and snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': *id001
        '429': *id001
  /live-sessions/{sessionId}:
    get:
      tags:
      - Live Quiz Arena
      operationId: getLiveQuizSession
      parameters:
      - &id002
        name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorised current session snapshot
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': *id001
        '404': *id001
  /live-sessions/{sessionId}/commands:
    post:
      tags:
      - Live Quiz Arena
      operationId: commandLiveQuizSession
      parameters:
      - *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - command
              - expectedRevision
              properties:
                command:
                  type: string
                expectedRevision:
                  type: string
              additionalProperties: true
      responses:
        '200':
          description: Accepted presenter state transition
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': *id001
        '409': *id001
  /live-sessions/{sessionId}/answers:
    post:
      tags:
      - Live Quiz Arena
      operationId: submitLiveQuizAnswer
      security: []
      parameters:
      - *id002
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - questionId
              - answer
              properties:
                questionId:
                  type: string
                answer:
                  type: string
              additionalProperties: true
      responses:
        '200':
          description: Durable answer receipt or same-key repeat receipt
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': *id001
        '409': *id001
        '422': *id001
  /live-sessions/{sessionId}/results:
    get:
      tags:
      - Live Quiz Arena
      operationId: getLiveQuizResults
      parameters:
      - *id002
      responses:
        '200':
          description: Policy-authorised live results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403': *id001
        '404': *id001
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SurveyId:
      name: surveyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SurveyCapability:
      name: X-Survey-Capability
      in: header
      required: false
      description: Required by the collection endpoint for a synthetic Registry distribution. Send only in this header.
      schema:
        type: string
        pattern: '^[0-9]{13}\.[A-Za-z0-9_-]{43}$'
    PublicToken:
      name: publicToken
      in: path
      required: true
      schema:
        type: string
        minLength: 16
  responses:
    Unauthorised:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Not authorised for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Version or idempotency conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Request throttled
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fields:
          type: array
          items:
            type: object
            required:
            - path
            - message
            properties:
              path:
                type: string
              message:
                type: string
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
    CurrentUser:
      type: object
      required:
      - id
      - displayName
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
    Workspace:
      type: object
      required:
      - id
      - organisationId
      - name
      properties:
        id:
          type: string
          format: uuid
        organisationId:
          type: string
          format: uuid
        name:
          type: string
        defaultRetentionPolicyId:
          type: string
          format: uuid
          description: Default retention policy when configured.
    CreateSurveyRequest:
      type: object
      additionalProperties: false
      required:
      - workspaceId
      - title
      - privacyMode
      - retentionPolicyId
      properties:
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        privacyMode:
          type: string
          enum:
          - anonymous
          - identified
          - pseudonymous
        retentionPolicyId:
          type: string
          format: uuid
    Survey:
      type: object
      required:
      - id
      - workspaceId
      - title
      - privacyMode
      - status
      properties:
        id:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        title:
          type: string
        privacyMode:
          type: string
          enum:
          - anonymous
          - identified
          - pseudonymous
        status:
          type: string
          enum:
          - draft
          - published
          - closed
          - retention_due
          - disposal_pending
          - disposed
        expiryAt:
          type:
          - string
          - 'null'
          format: date-time
    SurveyList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Survey'
        nextCursor:
          type:
          - string
          - 'null'
    SurveyDefinition:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - title
      - pages
      properties:
        schemaVersion:
          type: string
          const: '1'
        title:
          type: string
        description:
          type: string
        pages:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - id
            - questions
            properties:
              id:
                type: string
              title:
                type: string
              questions:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
    Question:
      type: object
      required:
      - id
      - code
      - type
      - title
      - required
      properties:
        id:
          type: string
        code:
          type: string
        type:
          type: string
          enum:
          - short_text
          - long_text
          - single_choice
          - multiple_choice
          - number
          - rating
          - dropdown
          - date
          - matrix
        title:
          type: string
        required:
          type: boolean
        options:
          type: array
          items:
            type: object
            required:
            - code
            - label
            properties:
              code:
                type: string
              label:
                type: string
        validation:
          type: object
          additionalProperties: true
          description: Validated against type-specific rules
    PublishedVersion:
      type: object
      required:
      - id
      - surveyId
      - version
      - hash
      - publishedAt
      properties:
        id:
          type: string
          format: uuid
        surveyId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        hash:
          type: string
        publishedAt:
          type: string
          format: date-time
        publicToken:
          type: string
          description: Opaque public link token returned at publication.
    PublicSurvey:
      type: object
      required:
      - surveyVersionId
      - definition
      properties:
        surveyVersionId:
          type: string
          format: uuid
        definition:
          $ref: '#/components/schemas/SurveyDefinition'
        closesAt:
          type:
          - string
          - 'null'
          format: date-time
    SubmitResponseRequest:
      type: object
      additionalProperties: false
      required:
      - surveyVersionId
      - answers
      properties:
        surveyVersionId:
          type: string
          format: uuid
        answers:
          type: array
          items:
            type: object
            required:
            - questionId
            - value
            properties:
              questionId:
                type: string
              value:
                description: Type validated against published question definition
    ResponseReceipt:
      type: object
      required:
      - receiptId
      - acceptedAt
      properties:
        receiptId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
    SurveyAnalytics:
      type: object
      required:
      - surveyId
      - responseCount
      - questions
      properties:
        surveyId:
          type: string
          format: uuid
        surveyVersionId:
          type: string
          format: uuid
        responseCount:
          type: integer
          minimum: 0
        questions:
          type: array
          items:
            type: object
            properties:
              questionId:
                type: string
              count:
                type: integer
              suppressed:
                type: boolean
              title:
                type: string
              categories:
                type: array
                items:
                  type: object
                  required: [code, label, count]
                  properties:
                    code:
                      type: string
                    label:
                      type: string
                    count:
                      type: integer
                      minimum: 0
    ExportRequest:
      type: object
      required:
      - format
      properties:
        format:
          type: string
          enum:
          - csv_bundle
          - jasp_csv_bundle
          description: Stage 1 JASP bundle is ZIP of UTF-8 responses.csv, codebook.csv, manifest.json and IMPORT_IN_JASP.md.
            SPSS .sav reserved for Stage 3.
        surveyVersionId:
          type: string
          format: uuid
          description: Pin the export to a published version of this survey. Defaults to the latest version.
        includeAttachments:
          type: boolean
          const: false
          default: false
    ExportJob:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - expired
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        downloadUrl:
          type:
          - string
          - 'null'
          format: uri-reference
          description: Authenticated relative download path. Available for 15 minutes after completion.
    Notice:
      type: object
      required:
      - id
      - category
      - severity
      - state
      - title
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        severity:
          type: string
          enum:
          - critical
          - action_required
          - advisory
          - information
        state:
          type: string
          enum:
          - open
          - acknowledged
          - assigned
          - in_progress
          - resolved
          - closed
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    AdminHealth:
      type: object
      required:
      - status
      - components
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - down
        components:
          type: array
          items:
            type: object
            required:
            - name
            - status
            properties:
              name:
                type: string
              status:
                type: string
    RetentionStatus:
      type: object
      required:
      - policiesConfigured
      - pendingExpiries
      properties:
        policiesConfigured:
          type: integer
          minimum: 0
        pendingExpiries:
          type: integer
          minimum: 0
    DisposalStatus:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - held
        finishedAt:
          type:
          - string
          - 'null'
          format: date-time
