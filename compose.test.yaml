services:
  postgres:
    labels:
      org.helpinsights.test-run: ${HELPINSIGHTS_TEST_PROJECT:?Run pnpm test:stack}
  app:
    labels:
      org.helpinsights.test-run: ${HELPINSIGHTS_TEST_PROJECT:?Run pnpm test:stack}
    environment:
      NODE_ENV: test
      HELPINSIGHTS_DEV_RESEARCH_CONSENT: synthetic
      HELPINSIGHTS_OAUTH_ISSUER: https://issuer.synthetic.test/oauth/v2.0
      HELPINSIGHTS_OAUTH_AUDIENCE: helpinsights.test.api
      HELPINSIGHTS_OAUTH_SCOPE: workspace.read
      HELPINSIGHTS_OAUTH_JWKS: ${HELPINSIGHTS_TEST_OAUTH_PUBLIC_JWKS:?Run pnpm test:stack}
      LIVE_QUIZ_ENABLED: "true"
      LIVE_GAME_SHOW_ENABLED: "true"
      LIVE_QUIZ_PIN_KEY: "helpinsights_disposable_test_only_join_pin_key"
      HELPINSIGHTS_DEV_REGISTRY_MODE: synthetic
      HELPINSIGHTS_TEST_REGISTRY_KEY: ${HELPINSIGHTS_TEST_REGISTRY_KEY:?Run pnpm test:stack}
    depends_on:
      registry-simulator:
        condition: service_healthy
  registry-simulator:
    build: .
    init: true
    command: ["node", "apps/worker/registry-simulator.ts"]
    environment:
      NODE_ENV: test
      HELPINSIGHTS_DEV_RESEARCH_CONSENT: synthetic
    labels:
      org.helpinsights.test-run: ${HELPINSIGHTS_TEST_PROJECT:?Run pnpm test:stack}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
  worker:
    labels:
      org.helpinsights.test-run: ${HELPINSIGHTS_TEST_PROJECT:?Run pnpm test:stack}
