name: Disposable PostgreSQL preflight (infrastructure only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/test-postgres.sh'
      - 'infra/compose.preflight.yaml'
      - '.github/workflows/preflight-postgres.yml'
jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run real disposable PostgreSQL SQL/restart test
        run: bash scripts/test-postgres.sh
      - name: Explicit scope statement
        run: echo 'INFRASTRUCTURE_ONLY - not application readiness evidence'
