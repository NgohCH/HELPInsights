name: Documentation contract
on:
  push:
  pull_request:
jobs:
  docs-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python scripts/validate_docs.py
