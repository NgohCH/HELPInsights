name: Mandatory application runtime verification
on:
  push:
  pull_request:
jobs:
  runtime-required:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed until executable runtime tests exist
        shell: bash
        run: |
          test -f package.json || { echo 'NOT_IMPLEMENTED: root package.json missing'; exit 1; }
          test -f compose.yaml || { echo 'NOT_IMPLEMENTED: compose.yaml missing'; exit 1; }
          test -f scripts/ci-runtime.sh || { echo 'NOT_IMPLEMENTED: scripts/ci-runtime.sh missing'; exit 1; }
          chmod +x scripts/ci-runtime.sh
          ./scripts/ci-runtime.sh
