name: Mandatory application runtime verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime-required:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Run required source, PostgreSQL, security and Chromium checks
        shell: bash
        run: bash scripts/ci-runtime.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-failure
          path: test-results/
          if-no-files-found: ignore
